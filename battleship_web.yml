  - ws-close: connection_lost
    auth:
      - none
    middleware: []
    actors:
      - multiplayer_host
      - multiplayer_client
    trigger: ctx.session.socket closed after ctx.session.handshake == complete without a prior QUIT
    result_channel: rendered page
    delivery: at-most-once
    cancellation: none
    ack_point: after step 1
    runtime: serial
    invariants:
      - Concurrency is serial per ctx.session.socket; runs once per socket.
      - Ordering is none; fires whenever the receive loop ends without QUIT after the handshake.
      - Closes before the handshake completes are handled by the awaiting page step using shared_protocol.page_error_mapping, not here (EARS-42).
      - Durability is browser-memory-bound; ctx.session is disposed (EARS-32).
      - Budget is one render.
      - Close code 4001 means the peer left and the local side wins by forfeit when no winner was declared; any other code ends the game with no winner (EARS-36).
    request_schema:
      - close_code: integer
      - close_reason: string
    env_vars: []
    response_schema:
      - result: string
    response_errors: []
    flow:
      - S1: decide ctx.reason when request.close_code == 4001 producing ctx.reason ensures reason == peer_left otherwise S3
        side_effects: [none]
        idempotent: yes
        emits: []
        failures: []
        transaction: none
        idempotency: none
        retry: none
        timeout: none
        compensation: none
      - S2: update ctx.session.winner to self when ctx.session.winner == none ensures winner == self by forfeit on_success S4
        side_effects: [mutate:ctx.session.winner]
        idempotent: yes
        emits:
          - peer_disconnected log at-most-once
          - game_over log at-most-once
        failures: []
        transaction: none
        idempotency: none
        retry: none
        timeout: none
        compensation: none
      - S3: update ctx.reason to connection_lost ensures ctx.session.winner unchanged
        side_effects: [mutate:ctx.reason]
        idempotent: yes
        emits:
          - connection_lost log at-most-once
        failures: []
        transaction: none
        idempotency: none
        retry: none
        timeout: none
        compensation: none
      - S4: release ctx.session using cleanup_handler ensures socket disposed and ctx.session cleared
        side_effects: [mutate:ctx.session]
        idempotent: keyed:ctx.session.socket
        emits: []
        failures: []
        transaction: none
        idempotency: idempotent_by ctx.session.socket
        retry: none
        timeout: none
        compensation: none
      - S5: record ctx.reason and ctx.session.winner to dom producing response.result ensures return-to-menu action shown
        side_effects: [write:dom]
        idempotent: yes
        emits: []
        failures: []
        transaction: none
        idempotency: none
        retry: none
        timeout: none
        compensation: none
        terminal: render game_over ctx.reason
    cancel_boundary: none
    uses_components:
      - ws_transport
      - session_state
      - board_renderer
      - cleanup_handler
      - app_logger
    upstream_depends_on_entries:
      - multiplayer_host
      - multiplayer_client
    cyclical_depends_on_entries: []
    excludes:
      - Automatic reconnection
      - Resuming a game on a new socket