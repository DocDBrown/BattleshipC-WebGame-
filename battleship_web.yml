  - ws-message: recv_shot
    auth:
      - none
    middleware: []
    actors:
      - multiplayer_host
      - multiplayer_client
    trigger: message.type == SHOT
    result_channel: ws push
    delivery: at-most-once
    cancellation: forced
    ack_point: after step 4
    runtime: serial
    invariants:
      - Concurrency is serial per ctx.session.socket; one SHOT is resolved before the next frame is decoded.
      - Ordering is required per request.seq; seq must equal ctx.session.peer_last_seq + 1 (EARS-29).
      - Durability is browser-memory-bound; own_board changes live only in ctx.session.
      - Budget is Battleship:ReadTimeoutSeconds for the RESULT send.
      - A SHOT received when ctx.session.turn != peer, out of bounds, or repeated is answered with ERROR and does not change the turn (EARS-15, EARS-16).
      - The frame is decoded into the shared_protocol SHOT record and is never evaluated (EARS-33).
      - RESULT follows the shared_protocol RESULT record and carries only seq, outcome, and the sunk ship name, never unhit own-ship coordinates (EARS-14).
    request_schema:
      - message: json
      - v: integer
      - type: string
      - seq: integer
      - coord: string
    env_vars:
      - Battleship:ReadTimeoutSeconds
    response_schema:
      - message: json
    response_errors:
      - VALIDATION_FAILED
      - CONFLICT
    flow:
      - S1: validate request.message using protocol_codec requires message decodes as the shared_protocol SHOT record producing request.seq on_failure VALIDATION S6
        side_effects: [none]
        idempotent: yes
        emits: []
        failures:
          - VALIDATION_FAILED: frame does not match the SHOT schema
        transaction: none
        idempotency: none
        retry: none
        timeout: none
        compensation: none
      - S2: validate request.seq requires ctx.session.turn == peer and request.seq == ctx.session.peer_last_seq + 1 and request.coord untried in ctx.session.own_board on_failure PRECONDITION S6
        side_effects: [none]
        idempotent: yes
        emits: []
        failures:
          - CONFLICT: EARS-16
        transaction: none
        idempotency: none
        retry: none
        timeout: none
        compensation: none
      - S3: resolve request.coord using shot_resolver from ctx.session.own_board producing ctx.outcome ensures outcome in {HIT, MISS, SUNK, GAME_OVER}
        side_effects: [mutate:ctx.session.own_board, mutate:ctx.session.peer_last_seq]
        idempotent: no
        emits:
          - shot_resolved log at-most-once
          - ship_sunk log at-most-once
        failures: []
        transaction: none
        idempotency: none
        retry: none
        timeout: none
        compensation: compensate:update ctx.session.own_board to previous value
      - S4: publish RESULT using protocol_codec to ws_transport redacting ctx.session.own_board.unhit_cells producing response.message ensures message.seq == request.seq on_failure CONFLICT S8
        side_effects: [external:ws_transport]
        idempotent: keyed:request.seq
        emits: []
        failures:
          - CONFLICT: send fails because the socket closed
        transaction: none
        idempotency: idempotent_by request.seq
        retry: none
        timeout: Battleship:ReadTimeoutSeconds
        compensation: compensate:update ctx.session.own_board to previous value
      - S5: update ctx.session.turn to self when ctx.outcome != GAME_OVER producing ctx.session.turn otherwise S7
        side_effects: [mutate:ctx.session.turn]
        idempotent: yes
        emits: []
        failures: []
        transaction: none
        idempotency: none
        retry: none
        timeout: none
        compensation: none
