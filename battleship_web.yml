        side_effects: [mutate:ctx.session.turn]
        idempotent: yes
        emits: []
        failures: []
        transaction: none
        idempotency: none
        retry: none
        timeout: none
        compensation: none
        terminal: send message none
      - S7: release ctx.session.socket using cleanup_handler ensures socket disposed
        side_effects: [external:ws_transport]
        idempotent: keyed:ctx.session.socket
        emits:
          - peer_disconnected log at-most-once
        failures: []
        transaction: none
        idempotency: idempotent_by ctx.session.socket
