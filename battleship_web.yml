  - ws-message: recv_hello
    auth:
      - none
    middleware: []
    actors:
      - multiplayer_host
      - multiplayer_client
    trigger: message.type == HELLO
    result_channel: ws push
    delivery: at-most-once
    cancellation: forced
    ack_point: after step 2
    runtime: serial
    invariants:
      - Concurrency is serial per ctx.session.socket; the receive loop decodes one frame at a time.
      - Ordering is required per ctx.session.socket; HELLO must be the first message received (EARS-28).
      - Durability is browser-memory-bound; nothing is persisted beyond ctx.session.
      - Budget is Battleship:HandshakeTimeoutSeconds, or Battleship:JoinTimeoutSeconds for the host.
      - The frame is decoded by protocol_codec into the shared_protocol HELLO record with unknown properties rejected and is never evaluated (EARS-33).
      - The server rejects a mismatched v before relay, so S2 is defence in depth for a stale cached app bundle.
    request_schema:
      - message: json
      - v: integer
      - type: string
    env_vars:
      - Battleship:HandshakeTimeoutSeconds
    response_schema:
      - message: json
    response_errors:
      - VALIDATION_FAILED
    flow:
      - S1: validate request.message using protocol_codec requires message decodes as the shared_protocol HELLO record producing ctx.peer_version on_failure VALIDATION S4
        side_effects: [none]
        idempotent: yes
        emits: []
        failures:
          - VALIDATION_FAILED: frame is not valid JSON or does not match the HELLO schema
        transaction: none
        idempotency: none
        retry: none
        timeout: none
        compensation: none
      - S2: decide ctx.version_ok when ctx.peer_version == ProtocolInfo.Version producing ctx.version_ok otherwise S4
        side_effects: [none]
        idempotent: yes
        emits: []
        failures:
          - VALIDATION_FAILED: ctx.peer_version != ProtocolInfo.Version
        transaction: none
        idempotency: none
        retry: none
        timeout: none
        compensation: none
      - S3: update ctx.session.peer_version ensures ctx.session.handshake == complete
        side_effects: [mutate:ctx.session.peer_version]
        idempotent: yes
        emits: []
        failures: []
        transaction: none
        idempotency: none
        retry: none
        timeout: none
        compensation: none
        terminal: send message none
      - S4: publish ERROR using protocol_codec to ws_transport with code VERSION_MISMATCH producing response.message on_failure VALIDATION S5
        side_effects: [external:ws_transport]
        idempotent: no
        emits:
          - protocol_error socket at-most-once
        failures:
          - VALIDATION_FAILED: send fails after invalid HELLO
        transaction: none
        idempotency: none
        retry: none
        timeout: Battleship:HandshakeTimeoutSeconds
        compensation: compensate:release ctx.session.socket using cleanup_handler
      - S5: release ctx.session.socket using cleanup_handler ensures CloseAsync 1002 sent
        side_effects: [external:ws_transport]
        idempotent: keyed:ctx.session.socket
        emits:
          - peer_disconnected log at-most-once
        failures: []
        transaction: none
        idempotency: idempotent_by ctx.session.socket
        retry: none
        timeout: Battleship:HandshakeTimeoutSeconds
        compensation: none
        terminal: close 1002
    cancel_boundary: forced on socket close at any step; cleanup_handler disposes the socket
    uses_components:
      - shared_protocol
      - protocol_codec
      - ws_transport
      - session_state
      - cleanup_handler
    upstream_depends_on_entries:
      - multiplayer_host
      - multiplayer_client
    cyclical_depends_on_entries: []
    excludes:
      - Version negotiation or downgrade
      - Capability advertisement

