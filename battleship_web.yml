      - Concurrency is serial per ctx.session.socket.
      - Ordering is none; ERROR may arrive at any point and may originate from the peer or the server.
      - Durability is browser-memory-bound; the error is shown in error_panel and written to the log only.
      - Budget is Battleship:HandshakeTimeoutSeconds for release on fatal errors.
      - Codes and their fatality follow shared_protocol.error_codes.
      - An ERROR answering a rejected SHOT or RESULT leaves ctx.session.turn unchanged so the local player can retry (EARS-16).
      - VERSION_MISMATCH tells the player to reload the page to get the current app.
      - The frame is decoded into the shared_protocol ERROR record and never evaluated (EARS-33).
