    trigger: navigate /join/{roomCode}
    result_channel: rendered page
    delivery: none
    cancellation: forced
    ack_point: n/a
    runtime: async
    invariants:
      - Concurrency is single-instance per page component; exactly one WebSocket to one room per session (EARS-25).
      - Ordering is required per ctx.session.seq; every RESULT must echo the pending seq and the client never fires before the host's first SHOT (EARS-29).
      - The client sends HELLO first and the host answers, so the host learns the client has joined from HELLO alone.
      - A room reporting 0 participants means the host has not connected yet and is retried, never joined (S4).
      - Durability is browser-memory-bound; boards, seq, and turn live only in ctx.session (EARS-31).
      - Budget is Battleship:HttpTimeoutSeconds per room check and connect, Battleship:HandshakeTimeoutSeconds for HELLO, READY, and the game-over QUIT, and Battleship:ReadTimeoutSeconds per awaited peer message.
      - CHAT may be sent from the chat box at any step from S12 to S24 through the S18 path without changing ctx.session.turn (EARS-30).
      - All frames use shared_protocol and are decoded by protocol_codec into typed records; nothing received is evaluated (EARS-33).
      - Server close codes before the handshake completes are mapped by shared_protocol.page_error_mapping (EARS-42).
      - QUIT at game over follows shared_protocol.game_over_rule.
      - Own unhit ship coordinates are never written to the socket (EARS-14).
    request_schema:
      - roomCode: string
    env_vars:
      - Battleship:HttpTimeoutSeconds
      - Battleship:HandshakeTimeoutSeconds
      - Battleship:ReadTimeoutSeconds
      - Battleship:JoinRetryCount
      - Battleship:JoinRetryDelayMs
    response_schema:
      - result: string
    response_errors:
      - VALIDATION_FAILED
      - NOT_FOUND
      - CONFLICT
      - RATE_LIMITED
      - UPSTREAM_UNAVAILABLE
      - INTERNAL
    flow:
      - S1: validate request.roomCode requires uppercased roomCode matches shared_protocol.room_code producing ctx.room_code on_failure VALIDATION S31
        side_effects: [none]
        idempotent: yes
        emits: []
        failures:
          - VALIDATION_FAILED: request.roomCode empty, wrong length, or outside the room code alphabet
        transaction: none
        idempotency: none
        retry: none
        timeout: none
        compensation: none
      - S2: load config from appsettings producing ctx.config
        side_effects: [read:config]
        idempotent: yes
        emits: []
        failures: []
        transaction: none
        idempotency: none
        retry: none
        timeout: none
        compensation: none
      - S3: compose session using session_state producing ctx.session ensures ctx.session.role == client and ctx.session.seq == 0 and ctx.session.turn == peer
        side_effects: [mutate:ctx.session]
        idempotent: yes
        emits:
          - game_started log at-most-once
        failures: []
        transaction: none
        idempotency: none
        retry: none
        timeout: none
        compensation: none
      - S4: invoke room_api_client to GET /api/rooms/{ctx.room_code} requires participants == 1 producing ctx.room on_failure NOT_FOUND S32 on_failure CONFLICT S32 on_failure RATE_LIMITED S32 on_failure UNAVAILABLE S32
        side_effects: [external:room_api_client]
        idempotent: yes
        emits: []
        failures:
          - NOT_FOUND: server responds 404, or participants is still 0 after Battleship:JoinRetryCount retries
          - CONFLICT: participants == 2 (EARS-26)
          - RATE_LIMITED: server responds 429
          - UPSTREAM_UNAVAILABLE: server unreachable or Battleship:HttpTimeoutSeconds elapsed
        transaction: none
        idempotency: none
        retry: up to Battleship:JoinRetryCount times every Battleship:JoinRetryDelayMs while participants == 0
