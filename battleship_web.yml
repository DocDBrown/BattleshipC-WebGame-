        side_effects: [none]
        idempotent: yes
        emits: []
        failures: []
        transaction: none
        idempotency: none
        retry: none
        timeout: none
        compensation: none
      - S4: release ctx.session.socket using cleanup_handler ensures CloseAsync 1000 sent and ctx.session disposed
        side_effects: [external:ws_transport, mutate:ctx.session]
        idempotent: keyed:ctx.session.socket
        emits:
          - peer_disconnected log at-most-once
        failures: []
        transaction: none
        idempotency: idempotent_by ctx.session.socket
        retry: none
        timeout: Battleship:HandshakeTimeoutSeconds
        compensation: none
        terminal: close 1000
      - S5: record ctx.error to log
        side_effects: [write:log]
        idempotent: yes
        emits: []
        failures: []
        transaction: none
        idempotency: none
        retry: none
        timeout: none
        compensation: none
        terminal: send message none
