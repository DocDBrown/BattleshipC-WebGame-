        failures:
          - VALIDATION_FAILED: send fails after invalid RESULT
        transaction: none
        idempotency: none
        retry: none
        timeout: Battleship:ReadTimeoutSeconds
        compensation: compensate:release ctx.session.socket using cleanup_handler
        terminal: send message one
