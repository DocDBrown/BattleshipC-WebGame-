# battleship_web.yml
service_entry_spec:
  service_name: battleship_web
  language: C#
  language_version: "14"
  framework: Blazor WebAssembly
  framework_version: ".NET 10"
  deployment_targets:
    - Static files served by battleship_server
  ears_requirements:
    - EARS-01 Web Battleship MUST support single-player Battleship against a local AI.
    - EARS-02 Web Battleship MUST offer three single-player difficulty levels, easy, medium, and hard, selected before ship placement.
    - EARS-03 Web Battleship MUST default single-player difficulty to medium when no valid difficulty is selected.
    - EARS-04 Web Battleship MUST keep the selected difficulty fixed for the duration of a single-player game.
    - EARS-05 Web Battleship MUST display the selected difficulty during a single-player game and on the game-over screen.
    - EARS-06 Web Battleship MUST support two-player Battleship over a WebSocket connection relayed through the game server.
    - EARS-07 Web Battleship MUST run as a browser application written in C# using Blazor WebAssembly on .NET 10, hosted by an ASP.NET Core server.
    - EARS-08 Web Battleship MUST run in current versions of Chrome, Edge, Firefox, and Safari without plugins.
    - EARS-09 Web Battleship MUST use a 10x10 board for each participant.
    - EARS-10 Web Battleship MUST use the fleet Carrier(5), Battleship(4), Cruiser(3), Submarine(3), and Patrol Boat(2).
    - EARS-11 Web Battleship MUST support manual and automatic ship placement.
    - EARS-12 Web Battleship MUST support ship placement and targeting by mouse, touch, and keyboard input.
    - EARS-13 Web Battleship MUST reject overlapping ships and placements outside board boundaries.
    - EARS-14 Web Battleship MUST keep each participant's unhit ship positions private and never send them to the server or the opponent.
    - EARS-15 Web Battleship MUST alternate turns after each valid shot.
    - EARS-16 Web Battleship MUST reject invalid coordinates and repeated shots without consuming a turn.
    - EARS-17 Web Battleship MUST report hit, miss, sunk ship, and game-over outcomes.
    - EARS-18 Web Battleship MUST end combat when all five ships belonging to one participant are sunk.
    - EARS-19 Web Battleship MUST provide a local AI that runs in the browser and chooses legal untried shots without inspecting hidden ship coordinates.
    - EARS-20 Web Battleship MUST base every local AI decision only on its own shot history, the reported hit, miss, and sunk outcomes, and the sizes of ships not yet sunk.
    - EARS-21 Web Battleship MUST make the easy local AI choose uniformly at random among untried cells.
    - EARS-22 Web Battleship MUST make the medium local AI choose random untried cells until it scores a hit, then target untried cells orthogonally adjacent to unresolved hits until the hit ship is reported sunk.
    - EARS-23 Web Battleship MUST make the hard local AI choose the untried cell with the highest count of legal placements of remaining ships consistent with known hits and misses, prioritising cells adjacent to unresolved hits and breaking ties randomly.
    - EARS-24 Web Battleship MUST place AI ships randomly using automatic placement at every difficulty level.
    - EARS-25 Web Battleship MUST use one host and one client joined to the same room through persistent WebSocket connections.
    - EARS-26 Web Battleship MUST identify multiplayer rooms by a short random room code and reject a third participant joining a full room.
    - EARS-27 Web Battleship MUST use ASP.NET Core WebSockets for real-time communication between browsers and the server.
    - EARS-28 Web Battleship MUST use a versioned JSON message protocol, one message per WebSocket text frame, supporting HELLO, READY, SHOT, RESULT, CHAT, QUIT, and ERROR.
    - EARS-29 Web Battleship MUST validate incoming protocol messages on both the server and the browser and associate shot results with the corresponding shot sequence.
    - EARS-30 Web Battleship MUST allow multiplayer chat without changing the active turn.
    - EARS-31 Web Battleship MUST maintain game state in browser memory and room state in server memory without requiring persistent storage.
    - EARS-32 Web Battleship MUST close WebSocket connections and dispose room state when a participant quits, disconnects, or closes the page.
    - EARS-33 Web Battleship MUST treat network messages as untrusted data, never evaluate them as code, and HTML-encode chat text before rendering.
    - EARS-34 WHEN an unknown route is requested, Web Battleship MUST navigate to the menu at / without adding a history entry.
    - EARS-35 WHEN a single-player route names a difficulty other than easy, medium, or hard, Web Battleship MUST navigate to /single/medium.
    - EARS-36 WHEN the WebSocket closes during a multiplayer game without a QUIT, Web Battleship MUST end the game, show why it ended, and offer a return to the menu.
    - EARS-42 WHEN the server closes the socket with 4004, 4009, 4029, or 4400 before the handshake completes, Web Battleship MUST show NOT_FOUND, CONFLICT, RATE_LIMITED, or VALIDATION_FAILED respectively.

ux_journeys:
  - journey_name: play_single_player
    goal: Play a full Battleship game against the local AI at a chosen difficulty with no network after load
    persona: player
    entry: single_player_difficulty_select
    steps:
      - 1: open /single → single_player_difficulty_select (medium preselected)
      - 2: choose easy, medium, or hard → single_player (setup phase, difficulty badge shown)
      - 3: choose manual or automatic placement → single_player (placement)
      - 4: place five ships by click, tap, drag, or keyboard without overlap or out-of-bounds → single_player (combat, both boards shown)
      - 5: select a target cell → single_player (hit/miss/sunk announced, targeting board updated)
      - 6: AI fires a legal untried shot chosen by the selected difficulty → single_player (own board updated)
      - 7: repeat 5–6 until one fleet is destroyed → single_player (game over with winner and difficulty)
      - 8: choose rematch or change difficulty → single_player or single_player_difficulty_select
    exit: Winner and difficulty displayed with rematch and change-difficulty actions
    invokes:
      - single_player_difficulty_select
      - single_player

  - journey_name: host_multiplayer
    goal: Host a game that one remote player joins by room code
    persona: multiplayer_host
    entry: multiplayer_host
    steps:
      - 1: open /host → multiplayer_host (creating room)
      - 2: room created and WebSocket open with role host → multiplayer_host (room code and join link shown, waiting)
      - 3: client HELLO received, HELLO returned → multiplayer_host (setup phase)
      - 4: place fleet → multiplayer_host (waiting for READY)
      - 5: both READY → multiplayer_host (combat, host fires first)
      - 6: send SHOT, receive RESULT, receive SHOT, send RESULT, optionally exchange CHAT → multiplayer_host (combat)
      - 7: one fleet sunk → multiplayer_host (game over; winner sends QUIT, loser waits for it)
    exit: Winner displayed, WebSocket closed, return-to-menu offered
    invokes:
      - multiplayer_host
      - recv_hello
      - recv_ready
      - recv_shot
      - recv_result
      - recv_chat
      - recv_quit
      - recv_error
      - connection_lost

  - journey_name: join_multiplayer
    goal: Join a hosted game by room code and play to completion
    persona: multiplayer_client
    entry: multiplayer_client
    steps:
      - 1: enter the room code on the menu or open the shared link → multiplayer_client (checking room, retrying briefly while the host connects)
      - 2: room has its host, WebSocket open with role client, HELLO sent and returned → multiplayer_client (setup phase)
      - 3: place fleet → multiplayer_client (waiting for READY)
      - 4: both READY → multiplayer_client (combat, waiting for host SHOT)
      - 5: receive SHOT, send RESULT, send SHOT, receive RESULT, optionally exchange CHAT → multiplayer_client (combat)
      - 6: one fleet sunk → multiplayer_client (game over; winner sends QUIT, loser waits for it)
    exit: Winner displayed, WebSocket closed, return-to-menu offered
    invokes:
      - multiplayer_client
      - recv_hello
      - recv_ready
      - recv_shot
      - recv_result
      - recv_chat
      - recv_quit
      - recv_error
      - connection_lost

  - journey_name: multiplayer_chat
    goal: Exchange text with the opponent during a game
    persona: multiplayer_client
    entry: multiplayer_client
    steps:
      - 1: type in the chat box and press Enter or Send → multiplayer_client (CHAT sent, turn unchanged)
      - 2: peer CHAT arrives → multiplayer_client (message appended to chat log as encoded text, turn unchanged)
    exit: Message displayed on both sides with the active turn preserved
    invokes:
      - recv_chat

  - journey_name: get_help
    goal: Learn how to play and how to host or join
    persona: player
    entry: help
    steps:
      - 1: open /help from the menu → help
    exit: Rules, controls, and multiplayer instructions displayed
    invokes:
      - help

screens:
  - screen: menu
    purpose: Entry point for all modes
    shows:
      - title
      - mode_buttons (single player, host game, join game, help)
      - room_code_input (6 characters, uppercase)
    actions:
      - single player -> single_player_difficulty_select
      - host game -> multiplayer_host
      - enter room code and join -> multiplayer_client
      - help -> help

  - screen: single_player_difficulty_select
    purpose: Choose the AI difficulty before a single-player game
    shows:
      - difficulty_options (easy, medium, hard with one-line descriptions)
      - default_selection (medium)
    actions:
      - choose easy -> single_player
      - choose medium -> single_player
      - choose hard -> single_player
      - back -> menu

  - screen: single_player
    purpose: Local game against the AI
    shows:
      - difficulty_badge (easy, medium, or hard)
      - own_board (10x10, ships and incoming hits and misses)
      - targeting_board (10x10, shot history only)
      - fleet_status (per ship afloat or sunk) for both sides
      - turn_indicator (yours or AI)
      - last_outcome (HIT, MISS, SUNK with ship, GAME OVER)
      - game_over_panel (winner, difficulty, rematch, change difficulty)
    actions:
      - choose placement mode (manual or auto) -> single_player.placement
      - place or rotate a ship by click, tap, drag, or arrow keys and R -> single_player.placement
      - select target cell by click, tap, or arrow keys and Enter -> single_player.combat
      - rematch -> single_player (new session, same difficulty)
      - change difficulty -> single_player_difficulty_select
      - quit -> menu

  - screen: multiplayer_host
    purpose: Host-side networked game
    shows:
      - room_status (creating, waiting for opponent, connected)
      - room_code
      - join_link with copy button
      - protocol_version
      - own_board
      - targeting_board
      - fleet_status
      - chat_log
      - chat_input
      - turn_indicator (yours or opponent)
      - last_outcome
      - error_panel
    actions:
      - copy join link -> multiplayer_host (unchanged)
      - choose placement mode and place ships -> multiplayer_host.placement
      - select target cell -> multiplayer_host.combat
      - send chat -> multiplayer_host (turn unchanged)
      - quit -> menu (QUIT sent)

  - screen: multiplayer_client
    purpose: Client-side networked game
    shows:
      - room_status (checking, waiting for host, connecting, connected)
      - room_code
      - protocol_version
      - own_board
      - targeting_board
      - fleet_status
      - chat_log
      - chat_input
      - turn_indicator
      - last_outcome
      - error_panel
    actions:
      - choose placement mode and place ships -> multiplayer_client.placement
      - select target cell -> multiplayer_client.combat
      - send chat -> multiplayer_client (turn unchanged)
      - quit -> menu (QUIT sent)

  - screen: help
    purpose: Rules and instructions
    shows:
      - rules (board, fleet, turns, outcomes)
      - controls (mouse, touch, keyboard)
      - difficulty_descriptions
      - multiplayer_instructions (host, share code, join)
    actions:
      - back -> menu

service_events:
  - game_started
  - difficulty_selected
  - fleet_placed
  - shot_fired
  - shot_resolved
  - ship_sunk
  - game_over
  - room_created
  - peer_connected
  - peer_disconnected
  - chat_received
  - protocol_error
  - connection_lost

service_components:
  - page_router
  - input_handler
  - board_renderer
  - board_engine
  - fleet_placement
  - shot_resolver
  - ai_strategy_easy
  - ai_strategy_medium
  - ai_strategy_hard
  - session_state
  - shared_protocol
  - protocol_codec
  - chat_sanitizer
  - ws_transport
  - room_api_client
  - cleanup_handler
  - app_logger

shared_protocol:
  assembly: Battleship.Shared
  version: 1
  version_source: ProtocolInfo.Version constant compiled into both battleship_web and battleship_server
  max_message_bytes: 4096
  max_message_bytes_source: ProtocolInfo.MaxMessageBytes constant compiled into both battleship_web and battleship_server
  connect_url: wss://origin/ws/rooms/{roomCode}?role={host|client}
  room_code: 6 characters matching ^[A-HJ-NP-Z2-9]{6}$
  framing:
    - One UTF-8 JSON object per WebSocket text frame.
    - Frames larger than ProtocolInfo.MaxMessageBytes are rejected.
    - Property names are camelCase and unknown properties are rejected.
    - Every message carries v and type.
  messages:
    - type: HELLO
      sender: both
      phase: handshake; the client sends first and the host replies
      fields:
        - v: integer equal to ProtocolInfo.Version
        - type: HELLO
    - type: READY
      sender: both
      phase: after HELLO exchange, once per participant
      fields:
        - v: integer equal to ProtocolInfo.Version
        - type: READY
    - type: SHOT
      sender: the participant whose turn it is
      phase: combat
      fields:
        - v: integer equal to ProtocolInfo.Version
        - type: SHOT
        - seq: integer >= 1, strictly increasing per sender
        - coord: string matching ^[A-J](10|[1-9])$
    - type: RESULT
      sender: the participant who received the SHOT
      phase: combat
      fields:
        - v: integer equal to ProtocolInfo.Version
        - type: RESULT
        - seq: integer equal to the SHOT seq it answers
        - outcome: enum[HIT, MISS, SUNK, GAME_OVER]
        - ship: enum[CARRIER, BATTLESHIP, CRUISER, SUBMARINE, PATROL_BOAT] required when outcome is SUNK or GAME_OVER, omitted otherwise
    - type: CHAT
      sender: both
      phase: any time after HELLO exchange
      fields:
        - v: integer equal to ProtocolInfo.Version
        - type: CHAT
        - text: string of 1..200 UTF-16 code units with no control or bidi override characters
    - type: QUIT
      sender: the winner at game over, or a participant leaving early
      phase: any time
      fields:
        - v: integer equal to ProtocolInfo.Version
        - type: QUIT
    - type: ERROR
      sender: either participant or the server
      phase: any time
      fields:
        - v: integer equal to ProtocolInfo.Version
        - type: ERROR
        - code: enum[VALIDATION, CONFLICT, VERSION_MISMATCH, RATE_LIMITED, FATAL]
        - detail: optional string of 0..200 UTF-16 code units
  error_codes:
    - VALIDATION: message failed schema or game-rule checks; fatal only before the handshake completes
    - CONFLICT: message arrived out of turn, out of sequence, or with no peer connected
    - VERSION_MISMATCH: v differs from ProtocolInfo.Version; always fatal
    - RATE_LIMITED: sender exceeded the server message rate; never fatal
    - FATAL: sender is ending the session
  close_codes:
    - 1000: normal closure after QUIT or game over
    - 1001: server shutdown or room expired
    - 1002: protocol error or version mismatch
    - 1003: binary frame received
    - 1009: frame exceeded ProtocolInfo.MaxMessageBytes
    - 1011: internal error
    - 4001: peer disconnected
    - 4004: room not found, or role client requested before the host connected
    - 4009: room full, or requested role already taken
    - 4029: connection rate limit exceeded
    - 4400: invalid room code or role
  page_error_mapping:
    - 4004: NOT_FOUND
    - 4009: CONFLICT
    - 4029: RATE_LIMITED
    - 4400: VALIDATION_FAILED
    - 1001: UPSTREAM_UNAVAILABLE
    - 1002: VALIDATION_FAILED
    - 1011: UPSTREAM_UNAVAILABLE
  game_over_rule: The participant who receives RESULT with outcome GAME_OVER sends QUIT then closes with 1000; the other participant waits up to Battleship:HandshakeTimeoutSeconds for QUIT, then closes with 1000.

service_entry_graph:
  - page: menu
    auth:
      - none
    middleware: []
    actors:
      - player
      - multiplayer_host
      - multiplayer_client
    trigger: navigate / or any unknown route
    result_channel: rendered page
    delivery: none
    cancellation: none
    ack_point: n/a
    runtime: async
    invariants:
      - Concurrency is single-instance per browser tab.
      - Ordering is none.
      - Durability is browser-memory-bound; nothing is stored (EARS-31).
      - Budget is one render; the entry performs no network I/O.
      - Unknown routes are replaced with / without a new history entry (EARS-34).
      - The room code input is uppercased and limited to 6 characters before navigation to /join/{roomCode}.
    request_schema:
      - path: string
    env_vars: []
    response_schema:
      - menu: html
    response_errors: []
    flow:
      - S1: decide ctx.known_route using page_router when request.path is a known route producing ctx.known_route on_success S3 otherwise S2
        side_effects: [none]
        idempotent: yes
        emits: []
        failures: []
        transaction: none
        idempotency: none
        retry: none
        timeout: none
        compensation: none
      - S2: invoke page_router to / replacing history entry
        side_effects: [navigate]
        idempotent: yes
        emits: []
        failures: []
        transaction: none
        idempotency: none
        retry: none
        timeout: none
        compensation: none
      - S3: invoke board_renderer to dom producing response.menu
        side_effects: [write:dom]
        idempotent: yes
        emits: []
        failures: []
        transaction: none
        idempotency: none
        retry: none
        timeout: none
        compensation: none
        terminal: render menu
    cancel_boundary: none
    uses_components:
      - page_router
      - board_renderer
    upstream_depends_on_entries: []
    cyclical_depends_on_entries: []
    excludes:
      - Accounts or player profiles
      - Lobby browsing or public room lists

  - page: single_player_difficulty_select
    auth:
      - none
    middleware: []
    actors:
      - player
    trigger: navigate /single
    result_channel: rendered page
    delivery: none
    cancellation: none
    ack_point: n/a
    runtime: async
    invariants:
      - Concurrency is single-instance per browser tab.
      - Ordering is none.
      - Durability is browser-memory-bound (EARS-31).
      - Budget is one render; the entry performs no network I/O.
      - Medium is preselected so pressing Enter without a choice starts a medium game (EARS-03).
      - Each option is reachable by keyboard and has a visible focus state (EARS-12).
    request_schema: []
    env_vars: []
    response_schema:
      - difficultyOptions: string[]
    response_errors: []
    flow:
      - S1: compose ctx.options producing response.difficultyOptions ensures options == [easy, medium, hard] and selected == medium
        side_effects: [none]
        idempotent: yes
        emits: []
        failures: []
        transaction: none
        idempotency: none
        retry: none
        timeout: none
        compensation: none
      - S2: invoke board_renderer to dom producing ctx.display
        side_effects: [write:dom]
        idempotent: yes
        emits: []
        failures: []
        transaction: none
        idempotency: none
        retry: none
        timeout: none
        compensation: none
      - S3: decide ctx.difficulty as player from input_handler requires ctx.difficulty in {easy, medium, hard} producing ctx.difficulty
        side_effects: [read:input_handler, navigate]
        idempotent: yes
        emits:
          - difficulty_selected log at-most-once
        failures: []
        transaction: none
        idempotency: none
        retry: none
        timeout: none
        compensation: none
        terminal: navigate /single/{ctx.difficulty}
    cancel_boundary: none
    uses_components:
      - input_handler
      - board_renderer
      - page_router
    upstream_depends_on_entries:
      - menu
    cyclical_depends_on_entries: []
    excludes:
      - Custom difficulty tuning
      - Remembering the last difficulty between visits

  - page: single_player
    auth:
      - none
    middleware: []
    actors:
      - player
      - local_ai_easy
      - local_ai_medium
      - local_ai_hard
    trigger: navigate /single/{difficulty}
    result_channel: rendered page
    delivery: none
    cancellation: forced
    ack_point: n/a
    runtime: async
    invariants:
      - Concurrency is single-instance per page component; one SinglePlayer component owns ctx.session (EARS-31).
      - Ordering is required per ctx.session.turn; the human and AI strictly alternate after each valid shot (EARS-15).
      - Durability is browser-memory-bound; nothing is written to localStorage, IndexedDB, cookies, or the server (EARS-31).
      - Budget is unbounded for human input; each AI decision must complete within Battleship:AiDecisionBudgetMs and is shown after Battleship:AiMoveDelayMs.
      - ctx.ai_strategy is chosen once at S4 from ctx.difficulty and never replaced during the session (EARS-04).
      - AI strategies receive only ctx.session.ai_view (own shot history, reported outcomes, remaining ship sizes) and never a reference to ctx.session.own_board (EARS-19, EARS-20).
      - Easy chooses uniformly among untried cells (EARS-21); medium hunts randomly then targets adjacent cells until sunk (EARS-22); hard counts legal placements per untried cell and picks the maximum (EARS-23).
      - The AI fleet is always placed automatically and randomly (EARS-24).
      - Invalid or repeated coordinates are rejected and do not advance ctx.session.turn (EARS-16).
      - Each board is exactly 10x10 and each fleet is exactly Carrier(5), Battleship(4), Cruiser(3), Submarine(3), Patrol Boat(2) (EARS-09, EARS-10).
      - The difficulty badge is visible from S8 until the page is left (EARS-05).
      - No network I/O occurs after the app has loaded.
    request_schema:
      - difficulty: enum[easy, medium, hard]
    env_vars:
      - Battleship:AiSeed
      - Battleship:AiMoveDelayMs
      - Battleship:AiDecisionBudgetMs
    response_schema:
      - difficulty: string
      - result: string
    response_errors:
      - VALIDATION_FAILED
      - INTERNAL
    flow:
      - S1: validate request.difficulty requires request.difficulty in {easy, medium, hard} producing ctx.difficulty on_failure VALIDATION S22
        side_effects: [none]
        idempotent: yes
        emits: []
        failures:
          - VALIDATION_FAILED: EARS-35
        transaction: none
        idempotency: none
        retry: none
        timeout: none
        compensation: none
      - S2: load config from appsettings producing ctx.config
        side_effects: [read:config]
        idempotent: yes
        emits: []
        failures: []
        transaction: none
        idempotency: none
        retry: none
        timeout: none
        compensation: none
      - S3: compose session using session_state producing ctx.session ensures ctx.session.turn == human and ctx.session.difficulty == ctx.difficulty
        side_effects: [mutate:ctx.session]
        idempotent: yes
        emits:
          - game_started log at-most-once
          - difficulty_selected log at-most-once
        failures: []
        transaction: none
        idempotency: none
        retry: none
        timeout: none
        compensation: none
      - S4: resolve ctx.ai_strategy from ctx.difficulty using ai_strategy_easy or ai_strategy_medium or ai_strategy_hard producing ctx.ai_strategy ensures strategy is fixed for the session
        side_effects: [mutate:ctx.ai_strategy]
        idempotent: yes
        emits: []
        failures: []
        transaction: none
        idempotency: none
        retry: none
        timeout: none
        compensation: none
      - S5: decide placement_mode as player from input_handler requires input in {manual, auto} producing ctx.placement_mode on_failure VALIDATION S5
        side_effects: [read:input_handler]
        idempotent: yes
        emits: []
        failures:
          - VALIDATION_FAILED: input not in {manual, auto}
        transaction: none
        idempotency: none
        retry: none
        timeout: none
        compensation: none
      - S6: compose own_board as player using fleet_placement from input_handler for_each fleet.ship sequential fail_fast ensures ships in bounds and non-overlapping on_failure VALIDATION S6
        side_effects: [mutate:ctx.session.own_board]
        idempotent: no
        emits:
          - fleet_placed log at-most-once
        failures:
          - VALIDATION_FAILED: EARS-13
        transaction: none
        idempotency: none
        retry: none
        timeout: none
        compensation: compensate:delete ctx.session.own_board
      - S7: compose ai_board using fleet_placement in automatic mode for_each fleet.ship sequential fail_fast ensures ships in bounds and non-overlapping on_failure INTERNAL S23
        side_effects: [mutate:ctx.session.ai_board]
        idempotent: no
        emits: []
        failures:
          - INTERNAL: fleet_placement fails to produce a legal placement after bounded attempts
        transaction: none
        idempotency: none
        retry: none
        timeout: none
        compensation: compensate:delete ctx.session.ai_board
      - S8: invoke board_renderer to dom redacting ctx.session.ai_board.ship_cells producing ctx.display ensures difficulty badge shown
        side_effects: [write:dom]
        idempotent: yes
        emits: []
        failures: []
        transaction: none
        idempotency: none
        retry: none
        timeout: none
        compensation: none
      - S9: iterate ctx.session.turns sequential fail_fast awaiting game_over until ctx.session.winner != none
        side_effects: [mutate:ctx.session]
        idempotent: no
        emits: []
        failures: []
        transaction: none
        idempotency: none
        retry: none
        timeout: none
        compensation: compensate:terminate ctx.session
        substeps:
          - S10: validate request.shot as player from input_handler requires ctx.session.turn == human and coordinate matches ^[A-J](10|[1-9])$ and untried in targeting_board producing ctx.shot on_failure VALIDATION S10
            side_effects: [read:input_handler]
            idempotent: yes
            emits: []
            failures:
              - VALIDATION_FAILED: EARS-16
            transaction: none
            idempotency: none
            retry: none
            timeout: none
            compensation: none
          - S11: resolve ctx.shot using shot_resolver from ctx.session.ai_board producing ctx.outcome ensures outcome in {HIT, MISS, SUNK, GAME_OVER}
            side_effects: [mutate:ctx.session.ai_board, mutate:ctx.session.targeting_board]
            idempotent: no
            emits:
              - shot_fired log at-most-once
              - shot_resolved log at-most-once
              - ship_sunk log at-most-once
            failures: []
            transaction: none
